name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks liệt kê commit của PR để quét, nên trên sự kiện pull_request nó cần
  # quyền này; thiếu thì action crash 403 trước cả khi quét được gì.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.2
  SEMGREP_IMAGE: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
  VERIFY_IMAGE: local-ci/zalo-sender:${{ github.sha }}

jobs:
  verify:
    name: Security and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all Git history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Block static application security findings
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --tmpfs /tmp/semgrep-home:rw,noexec,nosuid,size=96m \
            --env HOME=/tmp/semgrep-home \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --config=p/javascript \
              --config=p/typescript \
              --config=p/nextjs \
              --config=p/owasp-top-ten \
              --error \
              --metrics=off

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Chặn theo dependency chạy production. Công cụ dev (eslint và các gói kéo
      # theo) không có trong image standalone, và có lúc dính lỗ hổng chưa có
      # bản vá nào (ví dụ braces), khiến mọi deploy bị chặn vô cớ.
      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      - name: Report vulnerabilities in development tooling
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint source code
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build the production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      - name: Build the production container from the pinned base image
        run: |
          docker build --pull \
            --tag "$VERIFY_IMAGE" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key \
            .

      - name: Block high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.VERIFY_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: HIGH,CRITICAL

